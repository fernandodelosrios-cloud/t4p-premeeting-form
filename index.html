<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel4Purpose — Platform Mockups</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; font-family: 'DM Sans', sans-serif; background: #FFFFFF; }

.nav {
  height: 52px;
  background: #0A0A0A;
  border-bottom: 1px solid #E7E2DA;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 6px;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 9999;
}
.nav-logo { display: flex; align-items: center; gap: 8px; margin-right: 12px; }
.nav-icon {
  width: 28px; height: 28px;
  background: #E8631A;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 11px; color: #fff;
}
.nav-brand { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; color: #fff; }
.nav-sep { width: 1px; height: 20px; background: #E7E2DA; margin: 0 10px; }
.nav-tag { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #78716C; margin-right: 6px; }

.tab {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 14px;
  border-radius: 7px;
  font-size: 12px; font-weight: 500;
  color: #666;
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  transition: all .15s;
  white-space: nowrap;
  font-family: 'DM Sans', sans-serif;
}
.tab:hover { background: #F5F1EB; color: #1C1917; border-color: #E7E2DA; }
.tab.active { background: #E8631A; color: #fff; border-color: #E8631A; }
.tab-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

.nav-spacer { flex: 1; }
.nav-version { font-size: 10px; color: #A8A29E; }

.frame-wrap {
  position: fixed;
  top: 52px; left: 0; right: 0; bottom: 0;
}
iframe {
  width: 100%; height: 100%;
  border: none;
  display: none;
}
iframe.active { display: block; }

@media (max-width: 768px) {
  .nav { padding: 0 12px; gap: 4px; height: 48px; }
  .nav-sep, .nav-tag, .nav-version { display: none; }
  .nav-brand { font-size: 12px; }
  .nav-icon { width: 24px; height: 24px; font-size: 10px; }
  .tab { padding: 5px 10px; font-size: 11px; gap: 5px; }
  .tab-dot { width: 5px; height: 5px; }
  .frame-wrap { top: 48px; }
}

</style>
</head>
